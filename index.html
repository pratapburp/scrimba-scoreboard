<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div class="inner-container">
                <div class="score-block">
                    <h3>HOME</h3>
                        <div class="score-card">
                            <div id="home-score">-</div>
                        </div>
                        <div class="button-block">
                          <div class="button-wrapper">
                                <button class="h-one-point" onclick="hPlusOne()"> +1 </button>
                                <button class="h-two-point" onclick="hPlusTwo()"> +2 </button>
                                <button class="h-three-point" onclick="hPlusThree()"> +3 </button>
                            </div>
                            <button class="h-penalty" onclick="hPenalty()">PENALTY</button>
                        </div>
                </div>
                        
                <div class="score-block">
                    <h3>AWAY</h3>
                    <div class="score-card">
                        <div id="away-score">-</div>
                    </div>
                        <div class="button-block"></div>
                            <div class="button-wrapper">
                                <button class="a-one-point" onclick="aPlusOne()"> +1 </button>
                                <button class="a-two-point" onclick="aPlusTwo()"> +2 </button>
                                <button class="a-three-point" onclick="aPlusThree()"> +3 </button>
                            </div>
                        <button class="a-penalty" onclick="aPenalty()">PENALTY</button>
                    </div>
            </div>
            <button id="new-game" onclick="newGame()">NEW GAME</button>
        </div>
        
        <script src="index.js"></script>
    </body>
</html>
